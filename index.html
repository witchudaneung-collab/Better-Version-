<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Shanghai Cut 🇨🇳</title><style>body{font-family:system-ui,sans-serif;background:#F8F7F4;color:#292727;margin:0}.wrap{max-width:720px;margin:auto;padding:20px}.card{background:white;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 6px 24px #0000000d}h1{margin:5px 0}.muted{color:#77706F}.btn{background:#D85C6A;color:white;border:0;border-radius:14px;padding:12px 16px;font-weight:700}.bar{height:10px;background:#eee;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:#D85C6A}.row{display:flex;gap:10px;flex-wrap:wrap}.mini{flex:1;min-width:120px}.task{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.task:last-child{border:0}input[type=number],textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:12px}.nav{position:sticky;bottom:10px;background:#fff;border-radius:18px;padding:8px;display:flex;justify-content:space-around;box-shadow:0 6px 30px #0002}.nav button{border:0;background:none;padding:9px}.hide{display:none}.pill{display:inline-block;background:#f5e4e6;padding:5px 9px;border-radius:99px}.ex{cursor:pointer}.detail{font-size:.92em;color:#666;padding:8px 0}.done{text-decoration:line-through;color:#999}@media(prefers-color-scheme:dark){body{background:#242222;color:#f7f4f4}.card,.nav{background:#302d2d}.muted,.detail{color:#bbb}.task{border-color:#444}input,textarea{background:#393535;color:white;border-color:#555}}</style></head><body><div class='wrap'><div id='app'></div><div class='nav'><button onclick="show('today')">🏠<br>วันนี้</button><button onclick="show('calendar')">📅<br>แผน</button><button onclick="show('progress')">✨<br>Progress</button><button onclick="show('library')">🏋️<br>ท่า</button></div></div><script>
const workouts={
'2026-11-04':['💪 Upper A',['Lat Pulldown — 3×10–12','Chest Press — 3×10–12','Seated Row — 3×10–12','Shoulder Press — 3×10','Biceps Curl — 2×12','Triceps Pushdown — 2×12']],
'2026-11-05':['🚶 Light Cardio',['เดินลู่ 30–35 นาที — สบาย ไม่ชันหนัก']],

'2026-11-20':['☁️ REST',['พักเต็มที่']],

'2026-11-22':['🏃 Sunday Run',['สวนลุม Easy Run — 7 km','เย็นพัก']],
'2026-11-23':['💪 Upper B',['Lat Pulldown — 3×12','Seated Row — 3×12','Chest Press — 3×12','Lateral Raise — 3×12','Biceps Curl — 2×12','Triceps Pushdown — 2×12','Core']],
'2026-11-24':['🍑 Lower Body',['Leg Press — 3×10–12','Hip Thrust — 3×10–12','Romanian Deadlift — 3×10','Leg Curl — 3×12','Hip Abduction — 3×15']],
'2026-11-25':['🧘 Recovery',['เดินตามปกติ','Mobility — 15–20 min']],
'2026-11-26':['💪 Full Body / Upper Focus',['Lat Pulldown — 3×10','Chest Press — 3×10','Seated Row — 3×10','Light Hip Thrust — 2×12','Shoulder Press — 2×10','Core']],
'2026-11-27':['☁️ REST',['พักเต็มที่']],
'2026-11-28':['🧘 Core + Mobility',['Dead Bug','Bird Dog','Side Plank','Mobility']],
'2026-11-29':['🏃 Sunday Run',['สวนลุม Easy Run — 7 km','เย็นพัก']],
'2026-11-30':['💪 Upper Body',['Lat Pulldown — 3×10–12','Seated Row — 3×10–12','Chest Press — 3×10–12','Shoulder Press — 3×10','Biceps Curl — 2×12','Triceps Pushdown — 2×12']],
'2026-12-01':['🍑 Light Lower',['Leg Press — 2×10','Hip Thrust — 2×10','Leg Curl — 2×12','Hip Abduction — 2×12']],
'2026-12-02':['🧘 Recovery',['เดินตามปกติ','Mobility']],

};
const lib={
'Leg Press':'ต้นขาด้านหน้า + ก้น|หลังและสะโพกแนบเบาะ วางเท้ากว้างประมาณหัวไหล่ ดันออกแต่ไม่ล็อกเข่า|เข่าไปทิศเดียวกับปลายเท้า ถ้าเจ็บเข่าให้ลดน้ำหนักหรือหยุด',
'Hip Thrust':'ก้น|พิงหลังส่วนบนกับม้านั่ง ดันสะโพกขึ้นและบีบก้นด้านบน|อย่าแอ่นหลังเพื่อดันให้สูง',
'Romanian Deadlift':'ก้น + หลังต้นขา|งอเข่าเล็กน้อย ดันก้นไปด้านหลัง ดัมเบลชิดขา หลังเป็นกลาง|จำง่าย: ดันก้นไปด้านหลัง ไม่ใช่ก้มตัวลง',
'Lat Pulldown':'หลัง + ปีก|ดึงบาร์ลงหาอกส่วนบน คิดว่าใช้ข้อศอกดึงลง|ไม่ดึงหลังคอและไม่โยกตัว',
'Seated Row':'หลัง|ดึงเข้าหาลำตัว บีบสะบักเล็กน้อย|ไม่โยกตัวช่วย',
'Chest Press':'อก + หลังแขน|หลังแนบเบาะ ดันออกด้านหน้าแล้วกลับช้า ๆ|ไม่ล็อกข้อศอก',
'Shoulder Press':'หัวไหล่ + หลังแขน|ดันจากระดับไหล่ขึ้นเหนือศีรษะ|ไม่แอ่นหลังมาก',
'Lateral Raise':'หัวไหล่ด้านข้าง|ยกแขนออกด้านข้างถึงประมาณระดับไหล่|ใช้น้ำหนักเบา–ปานกลาง ไม่เหวี่ยง',
'Biceps Curl':'หน้าแขน|ข้อศอกชิดลำตัว งอแขนขึ้นแล้วลดช้า ๆ|ไม่เหวี่ยงตัว',
'Triceps Pushdown':'หลังแขน|ข้อศอกชิดลำตัว กดเคเบิลลง|ไม่ใช้ลำตัวช่วย',
'Leg Curl':'หลังต้นขา|งอเข่าดึงน้ำหนักเข้าหาตัวแล้วคืนช้า ๆ|ไม่เหวี่ยงน้ำหนัก',
'Hip Abduction':'ก้นด้านข้าง + สะโพก|กางเข่าออกแล้วกลับช้า ๆ|ไม่กระแทกน้ำหนัก',
'Plank':'Core|ข้อศอกใต้ไหล่ เกร็งท้องและก้น ลำตัวตรง|ไม่ปล่อยเอวตก',
'Dead Bug':'Core|นอนหงาย เหยียดแขนและขาฝั่งตรงข้ามช้า ๆ|หลังล่างไม่ควรแอ่นจากพื้น',
'Bird Dog':'Core + การทรงตัว|ตั้งท่าคลาน เหยียดแขนและขาฝั่งตรงข้าม|รักษาสะโพกให้นิ่ง',
'Side Plank':'Core ด้านข้าง|ข้อศอกใต้ไหล่ ยกสะโพกให้ลำตัวตรง|ถ้ายากให้งอเข่าช่วยพยุง'
};
let state=JSON.parse(localStorage.getItem('shanghaiCut')||'{}'); const save=()=>localStorage.setItem('shanghaiCut',JSON.stringify(state));
function key(d,t){return d+'|'+t} function toggle(d,t){state[key(d,t)]=!state[key(d,t)];save();renderToday(d)}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'})}
function nearest(){let today=new Date().toISOString().slice(0,10);if(workouts[today])return today;return '2026-11-04'}
function renderToday(d=nearest()){let w=workouts[d];let tasks=w[1].map(t=>`<div class='task ${state[key(d,t)]?'done':''}'><input type='checkbox' ${state[key(d,t)]?'checked':''} onchange="toggle('${d}',${JSON.stringify(t)})"><div><b>${t}</b>${detailFor(t)}</div></div>`).join('');let done=w[1].filter(t=>state[key(d,t)]).length,p=Math.round(done/w[1].length*100);app.innerHTML=`<section id='today'><div class='muted'>Shanghai Cut 🇨🇳 · 4 Nov–4 Dec</div><h1>${w[0]}</h1><div class='muted'>${fmt(d)}</div><div class='card'><div class='bar'><i style='width:${p}%'></i></div><p>${p}% complete</p>${tasks}</div><div class='row'><div class='card mini'>⚖️ น้ำหนัก<input type='number' step='.1' value='${state.weight||''}' onchange='state.weight=this.value;save()' placeholder='kg'></div><div class='card mini'>🥛 โปรตีน<input type='number' value='${state.protein||''}' onchange='state.protein=this.value;save()' placeholder='/110 g'></div><div class='card mini'>😴 นอน<input type='number' step='.1' value='${state.sleep||''}' onchange='state.sleep=this.value;save()' placeholder='ชม.'></div></div><div class='card'><b>สภาพขาวันนี้</b><p><select onchange='state.legs=this.value;save()'><option>🟢 สดชื่น</option><option>🟡 ล้าเล็กน้อย</option><option>🟠 ปวดกล้ามเนื้อ</option><option>🔴 เจ็บ</option></select></p><textarea placeholder='หมายเหตุ...' onchange='state.note=this.value;save()'>${state.note||''}</textarea></div></section>`}
function detailFor(t){for(const n in lib)if(t.includes(n))return `<div class='detail ex' onclick="alert(${JSON.stringify(n+'\n\nกล้ามเนื้อ: '+lib[n].split('|')[0]+'\n\nวิธีทำ: '+lib[n].split('|')[1]+'\n\nข้อควรระวัง: '+lib[n].split('|')[2])})">ⓘ ดูวิธีทำ</div>`;return ''}
function show(x){if(x==='today')return renderToday();if(x==='calendar'){app.innerHTML=`<h1>📅 โปรแกรมทั้งหมด</h1>${Object.entries(workouts).map(([d,w])=>`<div class='card' onclick="renderToday('${d}')"><span class='pill'>${fmt(d)}</span><h3>${w[0]}</h3><div class='muted'>${w[1].join(' · ')}</div></div>`).join('')}`};if(x==='progress'){let checks=0,total=0;Object.entries(workouts).forEach(([d,w])=>w[1].forEach(t=>{total++;if(state[key(d,t)])checks++}));app.innerHTML=`<h1>Your Progress ✨</h1><div class='card'><h2>${state.weight||'75.0'} kg</h2><div class='muted'>เป้าหมาย 70 kg</div><div class='bar'><i style='width:${Math.min(100,Math.max(0,(75-(+state.weight||75))/5*100))}%'></i></div></div><div class='card'><h2>${checks} / ${total}</h2><div class='muted'>Checklist ที่ทำแล้ว</div></div><div class='card'><b>มากกว่าตัวเลขบนตาชั่ง</b><p>☐ วิ่งรู้สึกง่ายขึ้น<br>☐ ยกน้ำหนักได้มากขึ้น<br>☐ เสื้อผ้าหลวมขึ้น<br>☐ พลังงานดีขึ้น<br>☐ รู้สึกแข็งแรงขึ้น</p></div>`};if(x==='library'){app.innerHTML=`<h1>🏋️ ท่าออกกำลังกาย</h1>${Object.entries(lib).map(([n,v])=>{let a=v.split('|');return `<div class='card'><h3>${n}</h3><b>กล้ามเนื้อ:</b> ${a[0]}<p><b>วิธีทำ:</b> ${a[1]}</p><p class='muted'><b>ข้อควรระวัง:</b> ${a[2]}</p></div>`}).join('')}`}}
renderToday();
</script></body></html>
